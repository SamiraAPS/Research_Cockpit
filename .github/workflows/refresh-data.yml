name: Refresh research data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ingestion/**'
      - 'scripts/calls/**'
      - 'scripts/update-data.mjs'
      - 'scripts/rank-similarity.mjs'
      - 'scripts/similarity/**'
      - 'config/reference-library.json'
      - 'config/manual-calls.json'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Ranking by closeness to the reference library. The embedding library is
      # installed into its own folder; the vectors are cached between runs and
      # never committed. A failure here leaves the previous ranking in place.
      - name: Restore embedding cache
        uses: actions/cache/restore@v4
        with:
          path: analysis-cache/similarity
          key: similarity-v1-${{ github.run_id }}
          restore-keys: similarity-v1-
      - name: Install embedding library
        continue-on-error: true
        run: npm install --prefix "$RUNNER_TEMP/similarity" --no-audit --no-fund @huggingface/transformers@4.3.2
      - name: Fetch, rank, analyze and validate a complete generation
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          SIMILARITY_MODEL: Xenova/all-MiniLM-L6-v2
          SIMILARITY_MODULE_DIR: ${{ runner.temp }}/similarity
        run: node scripts/update-data.mjs --max-pages=5 --similarity-minutes=8
      - name: Save embedding cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: analysis-cache/similarity
          key: similarity-v1-${{ github.run_id }}
      - name: Report coverage
        run: |
          echo '### Research data update' >> "$GITHUB_STEP_SUMMARY"
          echo 'Partial sources remain explicitly labeled; a validated update does not imply complete coverage.' >> "$GITHUB_STEP_SUMMARY"
          cat work/update-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit validated data
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh research corpus and source status'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit }}
