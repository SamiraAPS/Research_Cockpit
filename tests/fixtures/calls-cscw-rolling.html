  <h1>CALL FOR PAPERS FOR CSCW 2027 AND BEYOND</h1>
  <p>To present a paper at the ACM CSCW conference, you must have a paper accepted at one of two journals: PACM HCI/CSCW or ToCHI.</p>
  <p>There are no submission deadlines for any year's conference because submissions are rolling.</p>
